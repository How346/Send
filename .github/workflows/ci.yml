name: HyperDrop CI

on:
  push:
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          
      - name: Generate Android project
        shell: bash
        run: flutter create --platforms=android .

      - name: Auto-fix Gradle and AGP Conflicts
        shell: bash
        run: |
          # 1. Force the correct Gradle Wrapper URL
          cat <<EOF > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
          networkTimeout=100000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          # 2. Delete conflicting Kotlin DSL files so Gradle uses your Groovy files
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts
          rm -f android/settings.gradle.kts
          
          # 3. Force upgrade AGP version in existing Groovy files to fix Flutter requirement
          if [ -f "android/settings.gradle" ]; then
            sed -i -e 's/version "8.[0-9]*.[0-9]*"/version "8.11.1"/g' android/settings.gradle
            sed -i -e "s/version '8.[0-9]*.[0-9]*'/version '8.11.1'/g" android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -e "s/com.android.tools.build:gradle:8.[0-9]*.[0-9]*/com.android.tools.build:gradle:8.11.1/g" android/build.gradle
            sed -i -e 's/com.android.tools.build:gradle:8.[0-9]*.[0-9]*/com.android.tools.build:gradle:8.11.1/g' android/build.gradle
          fi

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-Android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows project
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath HyperDrop-Windows-x64.zip

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-Windows
          path: HyperDrop-Windows-x64.zip

      - name: Build Installer (Inno Setup)
        run: iscc installer/HyperDrop.iss

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-Setup
          path: installer/HyperDrop-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - shell: bash
        run: |
          mkdir -p dist
          cp release/HyperDrop-Android/app-release.apk dist/HyperDrop-Android.apk
          cp release/HyperDrop-Android/app-release.aab dist/HyperDrop-Android.aab
          cp release/HyperDrop-Windows/HyperDrop-Windows-x64.zip dist/HyperDrop-Windows-x64.zip
          cp release/HyperDrop-Setup/HyperDrop-Setup.exe dist/HyperDrop-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
