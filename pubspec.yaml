name: hyperdrop
description: Premium local-first Android and Windows file transfer.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  cryptography: ^2.7.0
  file_picker: ^8.1.7
  desktop_drop: ^0.5.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
